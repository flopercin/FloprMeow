<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

canvas {
  display: block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const katakana = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンァィゥェォッャュョ';
const hiragana = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんっゃゅょ';
const kanji = '日月火水木金土年月時分秒人口手足目耳口心力気天地海山川花鳥風雨雪春夏秋冬';
const chars = katakana + hiragana + kanji;

let fontSize = 14;
let columns;
let drops = [];

function init() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  fontSize = window.innerWidth < 600 ? 12 : 14;
  columns = Math.floor(canvas.width / fontSize);

  drops = [];
  for (let i = 0; i < columns; i++) {
    drops[i] = Math.random() * -canvas.height / fontSize;
  }
}

function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < drops.length; i++) {
    const char = chars[Math.floor(Math.random() * chars.length)];
    const y = drops[i] * fontSize;

    const brightness = Math.random();
    if (brightness > 0.97) {
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 8;
    } else if (brightness > 0.85) {
      ctx.fillStyle = '#ff6666';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 4;
    } else {
      ctx.fillStyle = '#cc0000';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 2;
    }

    ctx.font = `${fontSize}px monospace`;
    ctx.fillText(char, i * fontSize, y);
    ctx.shadowBlur = 0;

    if (y > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }

    drops[i] += 0.5 + Math.random() * 0.5;
  }
}

init();
setInterval(draw, 40);

window.addEventListener('resize', () => {
  init();
});
</script>
</body>
</html>
